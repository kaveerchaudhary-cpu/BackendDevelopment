<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: "Report" }} — Backend Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#07091A;--panel:#0D1128;--line:rgba(227,179,65,.18);
    --gold:#E7B33E;--violet:#9B7FFF;--text:#ECE8DD;--muted:#8991B4;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.7}
  .backdrop{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(900px 560px at 8% -8%, rgba(155,127,255,.22), transparent 60%),
      radial-gradient(760px 480px at 105% 8%, rgba(231,179,62,.12), transparent 55%);
  }
  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:clamp(32px,6vw,72px) clamp(20px,5vw,40px) 96px}
  .back{display:inline-block;margin-bottom:36px;font-family:var(--mono);font-size:13px;color:var(--gold);text-decoration:none}
  .back:hover{text-decoration:underline}

  .report h1{
    font-family:var(--serif);font-style:italic;font-weight:400;
    font-size:clamp(34px,6vw,52px);line-height:1.05;letter-spacing:-.01em;
    margin:0 0 28px;padding-bottom:22px;color:#fff;border-bottom:1px solid var(--line);
  }
  .report h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:28px;margin:52px 0 14px;color:#fff}
  .report h3{font-size:19px;font-weight:600;margin:32px 0 8px;color:var(--gold)}
  .report p{margin:0 0 16px}
  .report a{color:var(--gold)}
  .report strong{color:#fff}
  .report ul,.report ol{padding-left:22px;margin:0 0 18px}
  .report li{margin:6px 0}
  .report li::marker{color:var(--violet)}
  .report code{font-family:var(--mono);font-size:.88em;background:rgba(155,127,255,.14);padding:2px 6px;border-radius:5px}
  .report pre{
    background:var(--panel);border:1px solid rgba(155,127,255,.22);border-radius:10px;
    padding:16px 18px;overflow-x:auto;margin:0 0 22px;line-height:1.55;
  }
  .report pre code{background:none;padding:0;font-size:13.5px}
  .report img{display:block;max-width:100%;height:auto;margin:14px 0 24px;border:1px solid var(--line);border-radius:10px}
  .report blockquote{margin:0 0 18px;padding:4px 18px;border-left:3px solid var(--gold);color:var(--muted)}
  .report table{border-collapse:collapse;width:100%;margin:0 0 22px;font-size:15px;display:block;overflow-x:auto}
  .report th,.report td{border:1px solid var(--line);padding:9px 12px;text-align:left}
  .report th{background:var(--panel);color:#fff}
  .report hr{border:0;border-top:1px solid var(--line);margin:40px 0}

  footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>

<div class="wrap">
  <a class="back" href="https://kaveerchaudhary-cpu.github.io/kabirchaudhary.github.io/">← Back to Backend Development</a>

  <article class="report">
    {{ content }}
  </article>

  <footer>Kabir Chaudhary · Roll no. 590015728 · B.Tech CSE, UPES</footer>
</div>

</body>
</html>
